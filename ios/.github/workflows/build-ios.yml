name: Build iOS App (IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Active Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Xcode Project (Unsigned)
        run: |
          cd projects/chat/ios
          xcodebuild clean build \
            -project RakhsshChat.xcodeproj \
            -scheme RakhsshChat \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into Sideloadable IPA
        run: |
          cd projects/chat/ios
          mkdir -p Payload
          cp -r build/derivedData/Build/Products/Release-iphoneos/RakhsshChat.app Payload/
          zip -r RakhsshChat.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RakhsshChat.ipa
          path: projects/chat/ios/RakhsshChat.ipa
